<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Registration Demo — Central/State Dropdown</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 480px; margin: 60px auto; color: #222; }
  h2 { margin-bottom: 4px; }
  p.sub { color: #666; margin-top: 0; }
  label { display: block; margin-top: 16px; font-weight: 600; font-size: 14px; }
  select, input { width: 100%; padding: 8px; margin-top: 4px; font-size: 14px;
                  border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
  button { margin-top: 20px; padding: 10px 16px; background: #2563eb; color: #fff;
           border: none; border-radius: 6px; font-size: 14px; cursor: pointer; }
  button:hover { background: #1d4ed8; }
  #result { margin-top: 16px; font-size: 14px; color: #16a34a; }
</style>
</head>
<body>
  <h2>Register</h2>
  <p class="sub">Two-step Ministry/Department selection, just like iGOT.</p>

  <form id="regForm">
    <label>Full Name</label>
    <input type="text" id="name" required>

    <label>Email</label>
    <input type="email" id="email" required>

    <label>Step 1: Central or State?</label>
    <select id="orgType" required>
      <option value="">-- select --</option>
      <option value="central">Central Government</option>
      <option value="state">State / UT Government</option>
    </select>

    <div id="stateSelectWrap" style="display:none;">
      <label>Which State/UT?</label>
      <select id="stateSelect"></select>
    </div>

    <label>Step 2: Which Ministry/Department?</label>
    <select id="orgSelect" required>
      <option value="">-- select org type first --</option>
    </select>

    <div id="subDeptWrap" style="display:none;">
      <label>Sub-department (if any)</label>
      <select id="subDeptSelect"></select>
    </div>

    <button type="submit">Register</button>
  </form>

  <div id="result"></div>

<script>
const orgType = document.getElementById('orgType');
const stateSelectWrap = document.getElementById('stateSelectWrap');
const stateSelect = document.getElementById('stateSelect');
const orgSelect = document.getElementById('orgSelect');
const subDeptWrap = document.getElementById('subDeptWrap');
const subDeptSelect = document.getElementById('subDeptSelect');

async function loadStates() {
  const res = await fetch('/api/states');
  const states = await res.json();
  stateSelect.innerHTML = states.map(s => `<option value="${s}">${s}</option>`).join('');
}

async function loadCentralMinistries() {
  const res = await fetch('/api/ministries/central');
  const ministries = await res.json();
  orgSelect.innerHTML = '<option value="">-- select --</option>' +
    ministries.map(m => `<option value="${m.id}">${m.name}</option>`).join('');
}

async function loadStateDepartments(stateName) {
  const res = await fetch(`/api/departments/state/${encodeURIComponent(stateName)}`);
  const depts = await res.json();
  orgSelect.innerHTML = '<option value="">-- select --</option>' +
    depts.map(d => `<option value="${d.id}">${d.name}</option>`).join('');
}

async function loadSubDepartments(ministryId) {
  const res = await fetch(`/api/ministries/central/${ministryId}/departments`);
  const subs = await res.json();
  if (subs.length) {
    subDeptWrap.style.display = 'block';
    subDeptSelect.innerHTML = subs.map(s => `<option value="${s.id}">${s.name}</option>`).join('');
  } else {
    subDeptWrap.style.display = 'none';
  }
}

orgType.addEventListener('change', async () => {
  if (orgType.value === 'central') {
    stateSelectWrap.style.display = 'none';
    subDeptWrap.style.display = 'none';
    await loadCentralMinistries();
  } else if (orgType.value === 'state') {
    stateSelectWrap.style.display = 'block';
    subDeptWrap.style.display = 'none';
    await loadStates();
    await loadStateDepartments(stateSelect.value);
  }
});

stateSelect.addEventListener('change', () => loadStateDepartments(stateSelect.value));

orgSelect.addEventListener('change', () => {
  if (orgType.value === 'central' && orgSelect.value) {
    loadSubDepartments(orgSelect.value);
  }
});

document.getElementById('regForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const payload = {
    name: document.getElementById('name').value,
    email: document.getElementById('email').value,
    orgType: orgType.value,
    orgId: subDeptSelect.value || orgSelect.value,
    state: orgType.value === 'state' ? stateSelect.value : null
  };
  const res = await fetch('/api/register', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  });
  const data = await res.json();
  document.getElementById('result').textContent = data.message;
});
</script>
</body>
</html>
