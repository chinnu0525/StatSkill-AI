<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StatSkill AI — AI-Powered Competency & Learning Platform for Official Statistics | MoSPI</title>
    <meta name="description" content="Capacity building and competency intelligence platform for India's Official Statistical System. Integrated with iGOT Karmayogi, NSSTA, and AI-enabled skill gap assessment.">
    <meta name="theme-color" content="#0B2545">

    <!-- Google Fonts: Outfit (Headings) & Inter (Body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- Font Awesome 6 Free Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: {
                            900: '#0B2545',
                            950: '#07182C'
                        },
                        saffron: {
                            500: '#F97316',
                            600: '#EA580C',
                            700: '#C2410C'
                        },
                        indiagreen: {
                            500: '#10B981',
                            600: '#059669',
                            700: '#047857'
                        }
                    },
                    fontFamily: {
                        heading: ['Outfit', 'sans-serif'],
                        body: ['Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>

    <!-- Chart.js CDN for Radar & Workforce Visualizations -->

    <!-- Custom CSS Design Tokens -->
    <link rel="stylesheet" href="/css/style.css">
</head>

    <div id="app" class="flex-1 flex flex-col">

        <div class="p-16 text-center text-slate-500 font-bold">

            <div>Loading StatSkill AI Platform...</div>

    </div>

    <script src="/js/components/adminDash.js?v=2.7"></script>
    <script src="/js/components/reports.js?v=2.7"></script>
